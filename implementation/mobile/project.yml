name: ScreenshotMatcher
options:
  bundleIdPrefix: com.itt.screenshotmatcher
  deploymentTarget:
    iOS: "17.0"
targets:
  ScreenshotMatcher:
    type: application
    platform: iOS
    sources:
      - path: ScreenshotMatcher/Sources
    info:
      path: ScreenshotMatcher/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "ScreenshotMatcher needs camera access to photograph the screen region you want to capture."
        NSLocalNetworkUsageDescription: "ScreenshotMatcher discovers and connects to a companion app running on your Mac over the local WiFi network."
        NSBonjourServices:
          - _shotmatcher._tcp
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
